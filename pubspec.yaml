name: lawyer_bro
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.11.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.4
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  freezed: ^3.2.5
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo (2).png"

# The following section is specific to Flutter packages.
