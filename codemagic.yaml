workflows:
  # ============================================================
  # DEVELOPMENT FLAVOR
  # Trigger: develop branch | Manual
  # Publishes: Android → Firebase App Distribution
  #            iOS     → TestFlight
  # ============================================================
  dev-build-workflow:
    name: LawyerBro Development
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.35.8
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
        - app_store_credentials
        - android_keystore
      vars:
        FLAVOR: development
        DART_ENTRY: lib/app_environment/entry_point/flavor_development.dart
        FIREBASE_ANDROID_APP_ID: $FIREBASE_ANDROID_APP_ID_DEV
        TESTER_GROUPS: internal-testers

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
        - $HOME/.gradle
        - $HOME/.android

    scripts:
      # ---- Common Setup ----
      - name: Get Flutter packages
        script: flutter pub get

      - name: Run tests
        script: flutter test
        ignore_failure: true

      # ---- Android Build ----
      - name: Build Android APK (Development)
        script: flutter build apk --release --flavor $FLAVOR -t $DART_ENTRY

      # ---- iOS Setup & Build ----
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            --type IOS_APP_DEVELOPMENT \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA (Development)
        script: |
          flutter build ipa --release \
            --flavor $FLAVOR \
            -t $DART_ENTRY \
            --export-options-plist=/Users/builder/export_options.plist

      # ---- Publish to Firebase App Distribution (Android) ----
      - name: Publish Android to Firebase App Distribution
        script: |
          appdistribution_artifact=$(find build/app/outputs/flutter-apk -name "*$FLAVOR-release.apk" | head -1)
          if [ -z "$appdistribution_artifact" ]; then
            echo "No APK found for flavor $FLAVOR"
            exit 1
          fi
          echo "Uploading $appdistribution_artifact"
          firebase appdistribution:distribute "$appdistribution_artifact" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --token "$FIREBASE_TOKEN"

    artifacts:
      - build/app/outputs/**/*.aab
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        is_enabled: true
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - sreenandhtp2003@gmail.com
        notify:
          success: true
          failure: true

